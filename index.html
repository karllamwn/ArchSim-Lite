<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArchSim Lite</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<!-- Libraries load from a CDN through an import map. This is what lets us
     write `import * as THREE from 'three'` with no build step, so the whole
     project stays a folder of files you can open from GitHub Pages. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<!-- ── Top bar: which mode, which round ─────────────────────────────────── -->
<header class="topbar">
  <div class="mode-tabs">
    <button class="mode-tab mode-tab-on" id="tabNegotiation">&#9673; NEGOTIATION</button>
    <button class="mode-tab" id="tabSurveillance">&#9675; SURVEILLANCE</button>
  </div>
  <div class="round-label" id="roundChip">ROUND 0</div>
  <div class="topbar-right">
    <span class="mode-chip" id="modeChip">demo</span>
  </div>
</header>

<main class="layout">

  <!-- ── 1. Metrics and design parameters ───────────────────────────────── -->
  <aside class="col col-metrics" id="metrics"></aside>

  <!-- ── 2. The design ──────────────────────────────────────────────────── -->
  <section class="col col-stage">
    <div class="stage-label">
      LATEST &middot; <span id="stageView">SITE VIEW</span>
      <span class="stage-north">&#9650; N</span>
    </div>
    <div class="viewport" id="viewport"></div>
    <div class="filmstrip" id="filmstrip"></div>
  </section>

  <!-- ── 3. The room where it is argued about ───────────────────────────── -->
  <section class="col col-office" id="office"></section>

  <!-- ── 4. Who is in the room, and what they just said ─────────────────── -->
  <aside class="col col-feed" id="feed"></aside>

  <!-- ── 5. What the round produced ─────────────────────────────────────── -->
  <aside class="col col-deliverables" id="deliverables"></aside>

</main>

<!-- ── Surveillance mode: a full-screen overlay over everything above ───── -->
<div id="surveillance" hidden></div>

<!-- ── Bottom bar: status and the actions ───────────────────────────────── -->
<footer class="actionbar">
  <div class="status" id="status">&#9673; READY</div>
  <div class="actions" id="actions"></div>
</footer>

<script type="module">
  import { initViewport } from './view/viewport.js';
  import { initPanel } from './ui/panel.js';
  import { initOffice } from './ui/office.js';
  import { initConversation } from './ui/conversation.js';
  import { initDeliverables } from './ui/deliverables.js';
  import { initSurveillance, showSurveillance, hideSurveillance } from './ui/surveillance.js';

  initViewport(document.getElementById('viewport'));
  initPanel(document.getElementById('metrics'));
  initOffice(document.getElementById('office'));
  initDeliverables(document.getElementById('deliverables'));
  initConversation(document.getElementById('feed'));
  initSurveillance(document.getElementById('surveillance'));

  document.getElementById('tabSurveillance').onclick = showSurveillance;
  document.getElementById('tabNegotiation').onclick = hideSurveillance;
</script>

</body>
</html>
