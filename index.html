<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArchSim Lite</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<!-- Libraries load from a CDN through an import map. This is what lets us
     write `import * as THREE from 'three'` with no build step, so the whole
     project stays a folder of files you can open from GitHub Pages. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<header class="topbar">
  <div class="brand">ArchSim <span>Lite</span></div>
  <div class="tagline">one agent &middot; one knowledge base &middot; one goal &middot; one tool</div>
  <div class="topbar-right">
    <span class="mode-chip" id="modeChip">demo</span>
    <span class="milestone" id="roundChip">round 0</span>
  </div>
</header>

<main class="layout">

  <!-- Left: design parameters, the sun, and the tool debug panel -->
  <aside class="panel panel-left">
    <div id="panel"></div>
    <section class="panel-section">
      <h2>Tools</h2>
      <div id="debug"></div>
    </section>
  </aside>

  <!-- Centre: the design above, the room where it is argued about below -->
  <section class="stage">
    <div class="stage-split">
      <div class="viewport" id="viewport"></div>
      <div id="office"></div>
    </div>

    <footer class="stage-note">
      Drag to orbit &middot; scroll to zoom &middot; right-drag to pan.
      The park is north of the site, which is where shadows fall.
    </footer>
  </section>

  <!-- Right: the negotiation, with the convergence charts beneath it -->
  <aside class="panel panel-right">
    <div id="agents"></div>
    <section class="panel-section">
      <h2>Convergence</h2>
      <div id="charts"></div>
    </section>
  </aside>

</main>

<script type="module">
  import { initViewport } from './view/viewport.js';
  import { initPanel } from './ui/panel.js';
  import { initDebug } from './ui/debug.js';
  import { initOffice } from './ui/office.js';
  import { initCharts } from './ui/charts.js';
  import { initConversation } from './ui/conversation.js';

  initViewport(document.getElementById('viewport'));
  initPanel(document.getElementById('panel'));
  initDebug(document.getElementById('debug'));
  initOffice(document.getElementById('office'));
  initCharts(document.getElementById('charts'));
  initConversation(document.getElementById('agents'));
</script>

</body>
</html>
